<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Strydom Travel Hub{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='mobile-workspace-11') }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <a class="logo" href="{{ url_for('home') }}">Strydom Travel Hub</a>
        <img class="header-mark" src="{{ url_for('static', filename='img/vibrant-holiday-badge.svg') }}" alt="">
      </div>
      <nav class="nav" aria-label="Site">
        <a href="{{ url_for('home') }}" aria-label="Home" title="Home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
        </a>
        <a href="{{ url_for('holiday_planning') }}" aria-label="Holiday Details" title="Holiday Details">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h8l5 5v15H6V2zm8 2.5V8h3.5L14 4.5zM8 11v2h9v-2H8zm0 4v2h9v-2H8z"/></svg>
        </a>
        <a href="{{ url_for('search') }}" aria-label="Search" title="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 0 1 5.17 10.46l3.94 3.93-1.42 1.42-3.93-3.94A6.5 6.5 0 1 1 10.5 4zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg>
        </a>
      </nav>
    </div>
  </header>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <a class="btn btn-ghost" href="{{ url_for('clear_plans') }}">Clear saved plans</a>
  </footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
